services:
  - type: web
    name: retentionai-churn-predictor
    runtime: python
    buildCommand: "pip install -r requirements.txt && python generate_data.py"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TABPFN_ACCESS_TOKEN
        sync: false
